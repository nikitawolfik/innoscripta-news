services:
  web:
    build: .
    image: innoscripta-news
    ports:
      - "${PORT:-8080}:8080"
    # Compose reads .env from this directory automatically. The `:?` form fails
    # with a readable message instead of starting a container that cannot serve
    # anything, and keeps the keys out of the image.
    environment:
      NEWSAPI_KEY: ${NEWSAPI_KEY:?missing NEWSAPI_KEY — copy .env.example to .env and fill it in}
      GUARDIAN_KEY: ${GUARDIAN_KEY:?missing GUARDIAN_KEY — copy .env.example to .env and fill it in}
      NYT_KEY: ${NYT_KEY:?missing NYT_KEY — copy .env.example to .env and fill it in}
    restart: unless-stopped
